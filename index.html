<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Nodex - Organic Collaboration</title>
    <meta name="description" content="Nodex - A collaboration platform with hierarchical tasks, smart filtering, and team coordination">
    <meta name="author" content="Polygon GmbH" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var key = "nodex.theme.mode";
        var raw = null;
        try {
          raw = localStorage.getItem(key);
        } catch (_) {}

        var mode = raw === "light" || raw === "dark" || raw === "auto" ? raw : "auto";
        if (mode !== raw) {
          try {
            localStorage.setItem(key, mode);
          } catch (_) {}
        }

        var prefersDark = false;
        try {
          prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (_) {}

        var effectiveTheme = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
        var root = document.documentElement;
        root.classList.toggle("dark", effectiveTheme === "dark");
        root.style.colorScheme = effectiveTheme;
        // Hide the app until the splash dismiss runs (src/lib/splash.ts). This
        // class always gets set because the IIFE runs synchronously during parse.
        root.classList.add("app-loading");
      })();
    </script>
    <style>
      /* Express splash: paints from index.html before the JS bundle loads. On
         dismiss (dismissSplash in main.tsx) the two logo strokes slide apart
         along their shared diagonal axis while the overlay dissolves. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(210 28% 98%);
        /* Only the background dissolves to reveal the app; the strokes animate
           independently. Fade to zero-alpha of the SAME color (not the
           `transparent` keyword) to avoid an interpolated grey flash. */
        transition: background-color 650ms ease;
      }
      html.dark #splash {
        background: hsl(220 20% 10%);
      }
      #splash svg {
        width: 62vmin;
        height: 62vmin;
        /* Let strokes travel beyond the 62vmin icon box, across the screen. */
        overflow: visible;
        animation: splash-pulse 1600ms ease-in-out infinite;
      }
      #splash .glyph path {
        stroke: #000000;
        transition: transform 800ms cubic-bezier(0.22, 1, 0.36, 1), opacity 800ms ease;
      }
      html.dark #splash .glyph path {
        stroke: hsl(210 100% 55%);
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      /* Dismiss: strokes glide apart along the diagonal axis of the parallel
         strokes (lower-left stroke up-left, upper-right stroke down-right) and
         fade; the overlay background dissolves. */
      #splash.splash-hide {
        pointer-events: none;
        background-color: hsl(210 28% 98% / 0);
      }
      html.dark #splash.splash-hide {
        background-color: hsl(220 20% 10% / 0);
      }
      #splash.splash-hide svg {
        animation: none;
      }
      /* path order matches index.html: 1 = lower-left stroke, 2 = upper-right. */
      #splash.splash-hide .glyph path:nth-of-type(1) {
        transform: translate(-150px, -160px);
        opacity: 0;
      }
      #splash.splash-hide .glyph path:nth-of-type(2) {
        transform: translate(150px, 160px);
        opacity: 0;
      }
      /* App fades in underneath the dissolving splash. */
      #root {
        transition: opacity 650ms ease;
      }
      html.app-loading #root {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #root {
          transition-duration: 200ms;
        }
        #splash .glyph path {
          transition: opacity 200ms ease;
        }
        #splash svg {
          animation: none;
        }
        #splash.splash-hide .glyph path {
          transform: none;
        }
      }
    </style>
    
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Mostr" />
  </head>

  <body>
    <div id="root"></div>
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
        <g
          class="glyph"
          transform="translate(-54.08,-13.59) scale(1.12)"
          fill="none"
          stroke-width="31.104"
          stroke-linecap="round"
        >
          <path d="M90.4329 180.698L90.0113 86.1228C89.9973 82.9897 93.8252 81.4563 95.9781 83.7326L166.928 158.748" />
          <path d="M202.53 40.0443L202.952 134.619C202.966 137.752 199.138 139.286 196.985 137.01L126.035 61.9938" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <style>
    /* Logo color — light mode black, dark mode brand blue (--primary). Adjust here. */
    svg { --logo: #000000; }
    @media (prefers-color-scheme: dark) {
      svg { --logo: hsl(210 100% 55%); }
    }
    /* First declaration is the fallback for renderers without var() support. */
